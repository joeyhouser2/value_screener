# Yahoo fallback for tickers with no SIC: first keyword found in Yahoo's industry
# (case-insensitive) picks the group; otherwise the Yahoo sector picks the sector
# and the group becomes "Other <sector>".
# Tickers whose SIC code misdescribes the business. SEC files these two under 6411
# (agents and brokers), but they underwrite: Enact is a mortgage insurer, Equitable a life insurer.
ticker_overrides:
  ACT: Insurance
  EQH: Insurance

yahoo_industry_keywords:
  - [REIT, REITs]
  - [Bank, Banks]
  - [Insurance, Insurance]
  - [Utilities, Utilities]
  - [Semiconductor, Semiconductors]
  - [Software, Software & IT Services]
  - [Biotechnology, Biotech]
  - [Drug Manufacturers, Pharmaceuticals]
  - [Oil & Gas E&P, Oil & Gas Producers]
  - [Oil & Gas Midstream, Midstream & Pipelines]
  - [Gold, Metals & Mining]
  - [Mining, Metals & Mining]
  - [Shell Companies, Shell Companies & SPACs]

yahoo_sectors:
  Technology: Technology
  Healthcare: Health Care
  Financial Services: Financials
  Consumer Cyclical: Consumer Discretionary
  Consumer Defensive: Consumer Staples
  Industrials: Industrials
  Energy: Energy
  Basic Materials: Materials
  Utilities: Utilities
  Real Estate: Real Estate
  Communication Services: Communication
