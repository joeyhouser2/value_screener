# XBRL tags per fundamental, in priority order. Companies tag the same idea
# differently and switch tags over time (e.g. Revenues -> RevenueFromContract...
# after ASC 606), so among the listed tags the one with the most recent period
# wins; priority only breaks ties.
#
# kind: flow    -> income / cash-flow item, built into TTM (or latest annual)
#       instant -> balance-sheet item, latest reported value

concepts:
  revenue:
    kind: flow
    unit: USD
    tags:
      - RevenueFromContractWithCustomerExcludingAssessedTax
      - Revenues
      - RevenueFromContractWithCustomerIncludingAssessedTax
      - SalesRevenueNet
      - RevenuesNetOfInterestExpense
      - InterestAndDividendIncomeOperating
  net_income:
    kind: flow
    unit: USD
    tags: [NetIncomeLoss, NetIncomeLossAvailableToCommonStockholdersBasic, ProfitLoss]
  operating_income:
    kind: flow
    unit: USD
    tags: [OperatingIncomeLoss]
  d_and_a:
    kind: flow
    unit: USD
    tags:
      - DepreciationDepletionAndAmortization
      - DepreciationAndAmortization
      - DepreciationAmortizationAndAccretionNet
      - Depreciation
  eps_diluted:
    kind: flow
    unit: USD/shares
    tags: [EarningsPerShareDiluted, EarningsPerShareBasicAndDiluted]
  operating_cash_flow:
    kind: flow
    unit: USD
    tags:
      - NetCashProvidedByUsedInOperatingActivities
      - NetCashProvidedByUsedInOperatingActivitiesContinuingOperations
  capex:
    kind: flow
    unit: USD
    tags:
      - PaymentsToAcquirePropertyPlantAndEquipment
      - PaymentsToAcquireProductiveAssets
      - PaymentsForCapitalImprovements
  dividends:
    kind: flow
    unit: USD
    tags: [PaymentsOfDividendsCommonStock, PaymentsOfDividends, PaymentsOfOrdinaryDividends]
  equity:
    kind: instant
    unit: USD
    tags:
      - StockholdersEquity
      - StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest
  cash:
    kind: instant
    unit: USD
    tags:
      - CashAndCashEquivalentsAtCarryingValue
      - CashCashEquivalentsRestrictedCashAndRestrictedCashEquivalents
      - Cash
  # Debt = total-debt tag, or noncurrent + current portions; plus short-term borrowings.
  debt_total:
    kind: instant
    unit: USD
    tags:
      - LongTermDebt
      - DebtAndCapitalLeaseObligations
      - LongTermDebtAndCapitalLeaseObligationsIncludingCurrentMaturities
  debt_noncurrent:
    kind: instant
    unit: USD
    tags: [LongTermDebtNoncurrent, LongTermDebtAndCapitalLeaseObligations, LongTermBorrowings]
  debt_current:
    kind: instant
    unit: USD
    tags: [LongTermDebtCurrent, DebtCurrent, LongTermDebtAndCapitalLeaseObligationsCurrent]
  # Last-resort total debt (homebuilders etc. tag only this); used only when no
  # debt tag above has a value, since for some filers it's just one kind of debt.
  notes_payable:
    kind: instant
    unit: USD
    tags: [NotesPayable]
  short_term_borrowings:
    kind: instant
    unit: USD
    tags: [ShortTermBorrowings, CommercialPaper]
  # --- Balance-sheet / income items for annual history (Phase 9: F-score, Altman Z,
  # NCAV, interest coverage). Not used by the TTM screen.
  gross_profit:
    kind: flow
    unit: USD
    tags: [GrossProfit]
  cost_of_revenue:        # gross profit = revenue - cost of revenue when GrossProfit is absent
    kind: flow
    unit: USD
    tags:
      - CostOfRevenue
      - CostOfGoodsAndServicesSold
      - CostOfGoodsSold
      - CostOfGoodsAndServiceExcludingDepreciationDepletionAndAmortization
  # EBIT fallback (pretax income + interest) for the many filers without OperatingIncomeLoss.
  pretax_income:
    kind: flow
    unit: USD
    tags:
      - IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItemsNoncontrollingInterest
      - IncomeLossFromContinuingOperationsBeforeIncomeTaxesMinorityInterestAndIncomeLossFromEquityMethodInvestments
  interest_expense:
    kind: flow
    unit: USD
    tags:
      - InterestExpense
      - InterestExpenseNonoperating
      - InterestExpenseDebt
      - InterestAndDebtExpense
      - InterestPaidNet
  assets:
    kind: instant
    unit: USD
    tags: [Assets]
  assets_current:
    kind: instant
    unit: USD
    tags: [AssetsCurrent]
  liabilities:
    kind: instant
    unit: USD
    tags: [Liabilities]
  liabilities_and_equity:  # liabilities = this - equity incl. NCI when Liabilities is absent
    kind: instant
    unit: USD
    tags: [LiabilitiesAndStockholdersEquity]
  equity_incl_nci:
    kind: instant
    unit: USD
    tags: [StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest]
  liabilities_current:
    kind: instant
    unit: USD
    tags: [LiabilitiesCurrent]
  retained_earnings:
    kind: instant
    unit: USD
    tags: [RetainedEarningsAccumulatedDeficit]
  goodwill:
    kind: instant
    unit: USD
    tags: [Goodwill]
  intangibles:
    kind: instant
    unit: USD
    tags:
      - IntangibleAssetsNetExcludingGoodwill
      - FiniteLivedIntangibleAssetsNet
  # Period-average share count: never summed into a TTM; history only.
  diluted_shares:
    kind: average
    unit: shares
    tags:
      - WeightedAverageNumberOfDilutedSharesOutstanding
      - WeightedAverageNumberOfShareOutstandingBasicAndDiluted
      - WeightedAverageNumberOfSharesOutstandingBasic
  # Shares: dei cover-page count first (summed across share classes), then us-gaap.
  shares_outstanding:
    kind: shares
    unit: shares
    tags:
      - dei:EntityCommonStockSharesOutstanding
      - CommonStockSharesOutstanding
