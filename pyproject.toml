[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "value-screener"
version = "0.1.0"
description = "Industry-relative cheap / fair / expensive labels for every NYSE + NASDAQ stock"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14",
    "PyYAML>=6.0",
    "requests>=2.31",
    "yfinance>=0.2.40",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
ui = ["streamlit>=1.30"]
dev = ["pytest>=8"]

[project.scripts]
value-screener = "value_screener.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
