# SIC code -> readable industry group + sector. Rules are checked in order and the
# first matching range wins, so specific ranges come before broad ones.
# `special` marks industries scored with their own metric set (see valuation.py):
#   bank, insurer, reit, utility.
# `cyclical` marks groups whose earnings follow the economic or commodity cycle (normalized.py).

groups:
  # --- Financials (special metric sets first) ---
  - {group: REITs, sector: Real Estate, special: reit, ranges: [[6798, 6798]]}
  - {group: Managed Care, sector: Health Care, ranges: [[6324, 6324]]}
  - {group: Banks, sector: Financials, special: bank, ranges: [[6000, 6099]]}
  - {group: Specialty Finance, sector: Financials, special: bank, ranges: [[6100, 6199]]}
  - {group: Insurance, sector: Financials, special: insurer, ranges: [[6300, 6399]]}
  - {group: Insurance Brokers, sector: Financials, ranges: [[6400, 6411]]}
  - {group: Capital Markets, sector: Financials, ranges: [[6200, 6299]]}
  - {group: Shell Companies & SPACs, sector: Financials, ranges: [[6770, 6770], [9995, 9995]]}
  - {group: Holding & Investment Cos, sector: Financials, ranges: [[6700, 6799]]}
  - {group: Real Estate Operators, sector: Real Estate, ranges: [[6500, 6599]]}

  # --- Utilities & energy ---
