  - {group: Waste & Environmental, sector: Industrials, ranges: [[4950, 4959]]}
  - {group: Utilities, sector: Utilities, special: utility, ranges: [[4900, 4949], [4960, 4999]]}
  - {group: Oil & Gas Services, cyclical: true, sector: Energy, ranges: [[1380, 1389], [3530, 3533]]}
  - {group: Oil & Gas Producers, cyclical: true, sector: Energy, ranges: [[1300, 1379]]}
  - {group: Refining & Marketing, cyclical: true, sector: Energy, ranges: [[2900, 2999], [5170, 5172]]}

