  - {group: Biotech, sector: Health Care, ranges: [[2835, 2836], [8731, 8731]]}
  - {group: Chemicals, cyclical: true, sector: Materials, ranges: [[2800, 2899], [3080, 3089]]}
  - {group: "Paper, Packaging & Forest", cyclical: true, sector: Materials, ranges: [[2400, 2499], [2600, 2679], [3410, 3412]]}
